<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATM</title>
    <link rel="stylesheet" href="./style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>

<body>
    <h1>Atm Simulator</h1>
    <main class="container d-flex justify-space-between"  id="atmlogin">
        <form action="" class="w-75">
            <label for="basicOTP" class="form-label">Enter OTP Code</label>
            <div class="form-otp" data-coreui-toggle="otp" data-coreui-id="basicOTP" data-coreui-name="otp"
                id="inputBox">
                <input class="form-otp-control" type="number" readonly>
                <input class="form-otp-control" type="number" readonly>
                <input class="form-otp-control" type="number" readonly>
                <input class="form-otp-control" type="number" readonly>
            </div>
            <button class="btn btn-primary mt-4" type="button" onclick="checkcorrectpin()">Continue</button>
        </form>

        <div class="row gy-4 w-25 border border-dark rounded-3 p-5" style="background-color: blanchedalmond;">
            <div class="col-4">
                <button class="btn btn-primary rounded-circle" onclick="handledialerbutton(1)">1</button>
            </div>
            <div class="col-4">
                <button class="btn btn-primary rounded-circle" onclick="handledialerbutton(2)">2</button>
            </div>
            <div class="col-4">
                <button class="btn btn-primary rounded-circle" onclick="handledialerbutton(3)">3</button>
            </div>
            <div class="col-4">
                <button class="btn btn-primary rounded-circle" onclick="handledialerbutton(4)">4</button>
            </div>
            <div class="col-4">
                <button class="btn btn-primary rounded-circle" onclick="handledialerbutton(5)">5</button>
            </div>
            <div class="col-4">
                <button class="btn btn-primary rounded-circle" onclick="handledialerbutton(6)">6</button>
            </div>
            <div class="col-4">
                <button class="btn btn-primary rounded-circle" onclick="handledialerbutton(7)">7</button>
            </div>
            <div class="col-4">
                <button class="btn btn-primary rounded-circle" onclick="handledialerbutton(8)">8</button>
            </div>
            <div class="col-4">
                <button class="btn btn-primary rounded-circle" onclick="handledialerbutton(9)">9</button>
            </div>
            <div class="col-4">
                <button class="btn btn-outline-primary" type="reset"  onclick="clearAllInputs()">X</button>
            </div>
            <div class="col-4">
                <button class="btn btn-primary rounded-circle" onclick="handledialerbutton(0)">0</button>
            </div>
        </div>

    </main>
        <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
            <div id="liveToast" class="toast fade hide" role="alert" aria-live="assertive" aria-atomic="true">
                <div class="toast-header">
                    <strong class="me-auto">Bootstrap</strong>
                    <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
                </div>
                <div class="toast-body">
                    Login Successfully
                </div>
            </div>
        </div>

        <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
            <div id="liveErrorToast" class="toast fade hide" role="alert" aria-live="assertive" aria-atomic="true">
                <div class="toast-header">
                    <strong class="me-auto">Bootstrap</strong>
                    <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"  onclick="dismiss()"></button>
                </div>
                <div class="toast-body">
                    Invalid Pin!
                </div>
            </div>
        </div>

        <div class="page-2 d-none " id="page">
            <button type="button" class="btn btn-dark">Money Withdraw</button>
            <button type="button" class="btn btn-dark">Money Transfer</button>
            <button type="button" class="btn btn-dark">Money Deposit</button>
            <button type="button" class="btn btn-dark" onclick="checkbalance()">Accont Balance</button>
        </div>

        <div class="page-3 d-none" id="paget">
            <h2> Your Current Balance is</h2>

        </div>








        <script src="./index.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
            crossorigin="anonymous"></script>
</body>

</html>
